<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seu galpão · Galpão</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="topo">
                <span class="marca"><span class="marca-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 21V10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1v11"/><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 1.132-1.803l7.95-3.974a2 2 0 0 1 1.837 0l7.948 3.974A2 2 0 0 1 22 8z"/><path d="M6 13h12"/><path d="M6 17h12"/></svg></span> Galpão</span>
                <button id="logout-btn" type="button" class="btn-ghost btn-sm">Sair</button>
            </div>

            <h1>Seu galpão</h1>
            <p class="muted">Crie um galpão novo ou entre em um existente com o código de convite.</p>

            <form id="criar-galpao-form">

                <div class="form-group">
                    <label for="nome-galpao">Nome do galpão</label>
                    <input type="text" id="nome-galpao" placeholder="Ex: Galpão Central" required>
                </div>

                <div class="form-group">
                    <label for="endereco-galpao">Endereço <span class="subtle">(opcional)</span></label>
                    <input type="text" id="endereco-galpao" placeholder="Ex: Rua das Flores, 123">
                </div>

                <button type="submit" class="btn-block">Criar galpão</button>

                <p id="criar-message" class="form-message"></p>

            </form>

            <div class="divisor">ou</div>

            <form id="entrar-galpao-form">

                <div class="form-group">
                    <label for="codigo-galpao">Código de convite</label>
                    <input type="text" id="codigo-galpao" placeholder="Cole o código recebido" class="mono" required>
                </div>

                <button type="submit" class="btn-secondary btn-block">Entrar no galpão</button>

                <p id="entrar-message" class="form-message"></p>

            </form>

            <p class="rodape hidden" id="voltar-painel">
                <a href="selecionar-galpao.html">← Voltar aos meus galpões</a>
            </p>

        </section>

    </main>

    <script type="module" src="js/galpao.js"></script>

</body>
</html>
