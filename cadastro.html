<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta · Galpão</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="topo">
                <span class="marca"><span class="marca-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V8l9-5 9 5v13"/><path d="M7 21v-8h10v8M7 17h10"/></svg></span> Galpão</span>
            </div>

            <h1>Criar conta</h1>
            <p class="muted">Cadastre-se para criar ou entrar em um galpão.</p>

            <form id="register-form">

                <div class="form-group">
                    <label for="name">Nome</label>
                    <input type="text" id="name" placeholder="Seu nome" autocomplete="name" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu@email.com" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Mínimo de 6 caracteres" minlength="6" autocomplete="new-password" required>
                </div>

                <button type="submit" class="btn-block">Criar conta</button>

                <p id="register-message" class="form-message"></p>

            </form>

            <p class="rodape">
                Já possui uma conta?
                <a href="login.html">Entrar</a>
            </p>

        </section>

    </main>

    <script type="module" src="js/cadastro.js"></script>

</body>
</html>
