<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel do Galpão</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <!-- QR code: geração (etiquetas) e leitura pela câmera -->
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>

<body>

    <div class="app">

        <aside class="sidebar">

            <span class="marca">
                <span class="marca-logo" id="marca-logo"></span>
                Galpão
            </span>

            <div class="galpao-atual">
                <strong id="galpao-nome">Carregando…</strong>
                <a id="trocar-galpao" href="selecionar-galpao.html" class="hidden">Trocar</a>
                <a href="galpao.html" id="novo-galpao">+ Novo / entrar</a>
            </div>

            <nav class="nav" id="nav" role="tablist" aria-label="Seções do painel"></nav>

            <div class="sidebar-rodape">
                <span class="avatar" id="usuario-avatar">?</span>
                <div class="usuario-info">
                    <strong id="usuario-nome">—</strong>
                    <span id="usuario-papel"></span>
                </div>
                <button id="logout-btn" class="btn-ghost btn-icon" title="Sair" aria-label="Sair"></button>
            </div>

        </aside>

        <main class="conteudo">
            <div class="conteudo-inner" id="conteudo">
                <div class="carregando">Carregando galpão…</div>
            </div>
        </main>

    </div>

    <script type="module" src="js/painel.js"></script>

</body>
</html>
